# Problem sets for the chain_sum task.
# Difficulty from the Stage 1 sweep (results/difficulty/chain_sum_qwen3-0.6b.csv):
# Qwen3-0.6B solves 51% at 8 terms of 4 digits and 38% at 10 terms, the harder
# level. Build the sets once, commit them with their manifest, and do not rebuild
# them after the first training run.
task: chain_sum
out_dir: data/chain_sum
prompt_style: single
loophole_seed: 0
splits:
  train:
    size: 5000
    seed: 1000000
    task_kwargs: {min_terms: 8, max_terms: 8, min_digits: 4, max_digits: 4}
  heldout:
    size: 500
    seed: 2000000
    task_kwargs: {min_terms: 8, max_terms: 8, min_digits: 4, max_digits: 4}
  harder:
    size: 500
    seed: 3000000
    task_kwargs: {min_terms: 10, max_terms: 10, min_digits: 4, max_digits: 4}
